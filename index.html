<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SC Mobile needs-intelligence demonstrator using synthetic data." />
    <title>SCB | Protection Insights Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="demo-bar" aria-label="Prototype controls">
      <span class="demo-pill">Illustrative prototype · Synthetic data</span>
      <nav aria-label="Demo personas">
        <a href="?persona=simon" data-persona="simon" aria-describedby="persona-popover" aria-expanded="false">Simon · Retirement</a>
        <a href="?persona=alex" data-persona="alex" aria-describedby="persona-popover" aria-expanded="false">Alex · Protection</a>
        <a href="?persona=sarah" data-persona="sarah" aria-describedby="persona-popover" aria-expanded="false">Sarah · Family</a>
      </nav>
      <div class="moment-explainer">
        <button class="moment-trigger" type="button" aria-label="How these customer moments are identified" aria-controls="moment-callout" aria-expanded="false">How these moments are identified</button>
        <aside id="moment-callout" class="moment-callout" role="note" aria-hidden="true">
          <strong>How these moments are identified</strong>
          <p>SCB data + customer context + analytics<br>→ relevant need<br>→ personalised journey</p>
          <small>Illustrative customer moments, not fixed personas</small>
        </aside>
      </div>
    </aside>
    <div id="persona-popover" class="persona-popover" role="tooltip" aria-hidden="true"></div>
    <main class="stage">
      <section class="phone" aria-label="SC Mobile prototype">
        <div id="app" class="app" aria-live="polite"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
