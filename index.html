<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SC Mobile Portfolio Intelligence prototype launcher." />
    <link rel="icon" href="data:," />
    <title>SCB | Portfolio Intelligence Prototype</title>
    <style>
      body{min-height:100vh;margin:0;display:grid;place-items:center;background:#eef4f8;color:#15304f;font:600 15px/1.5 system-ui,sans-serif}main{text-align:center}.loader{width:34px;height:34px;margin:0 auto 14px;border:4px solid #cbd9e6;border-top-color:#087ed1;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#0872bf}
    </style>
  </head>
  <body>
    <main><div class="loader" aria-hidden="true"></div><p>Loading the latest stable prototype…</p><noscript><p>JavaScript is required to select the latest version.</p></noscript></main>
    <script>
      if (location.protocol === 'file:') {
        location.replace(`./versions/v1.1/index.html${location.search}${location.hash}`);
      } else {
        fetch('./versions.json', { cache: 'no-cache' })
          .then(response => response.json())
          .then(versions => {
            const latest = versions.filter(item => item.status === 'stable').at(-1);
            if (!latest) throw new Error('No stable prototype version is configured.');
            location.replace(`.${latest.path}${location.search}${location.hash}`);
          })
          .catch(() => {
            document.querySelector('main').innerHTML = '<p>Unable to load the prototype version list. <a href="./versions/v1.1/index.html">Open the latest version</a>.</p>';
          });
      }
    </script>
  </body>
</html>
